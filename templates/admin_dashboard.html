{% extends 'base.html' %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<section class="grid two-col">
    <article class="card">
        <h2>Add Teacher</h2>
        <form method="post" action="{{ url_for('add_teacher') }}" class="form-grid">
            <label>
                Teacher Name
                <input type="text" name="name" required />
            </label>
            <label>
                Username
                <input type="text" name="username" required />
            </label>
            <label>
                Password
                <input type="password" name="password" required />
            </label>
            <button class="btn" type="submit">Create Teacher</button>
        </form>
    </article>

    <article class="card">
        <h2>Teachers</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for teacher in teachers %}
                    <tr>
                        <td>{{ teacher.name }}</td>
                        <td>{{ teacher.username }}</td>
                        <td>
                            <form method="post" action="{{ url_for('delete_teacher', teacher_id=teacher._id) }}" onsubmit="return confirm('Delete this teacher and all related data?');">
                                <button class="btn btn-danger" type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3">No teachers found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </article>
</section>
{% endblock %}
